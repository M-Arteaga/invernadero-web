<!-- public/index.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invernadero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        :root {
            --fondo-1: #f1f9e9;
            --fondo-2: #d9eecb;
            --menta: #cfe8c4;
            --hoja: #3d9150;
            --hoja-osc: #1f5a2b;
            --tierra: #6b4a2f;
            --tinta: #1d3a24;
            --temp: #d9533f;
            --hum: #2f86b5;
            --vidrio: rgba(255, 255, 255, .72);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Nunito', system-ui, sans-serif;
            color: var(--tinta);
            background: linear-gradient(180deg, var(--fondo-1), var(--fondo-2));
        }

        .pagina {
            position: relative;
            max-width: 880px;
            margin: 0 auto;
            padding: 2rem 1rem 0;
        }

        .deco {
            position: absolute;
            pointer-events: none;
            z-index: 0;
        }
        .deco.izq { left: -70px; top: 40px; width: 220px; }
        .deco.der { right: -70px; top: 150px; width: 220px; transform: scaleX(-1); }

        /* Estructura del invernadero: techo arqueado y paneles de vidrio */
        .invernadero {
            position: relative;
            z-index: 1;
            padding: 4.5rem 1.5rem 1.5rem;
            border: 4px solid var(--hoja-osc);
            border-radius: 50% 50% 18px 18px / 120px 120px 18px 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(207, 232, 196, .7));
            box-shadow: 0 10px 30px rgba(31, 90, 43, .15);
        }

        header { text-align: center; margin-bottom: 1.5rem; }
        h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; color: var(--hoja-osc); }
        .sub { margin: .2rem 0 .9rem; color: #3f5f46; }

        .estado {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .3rem .9rem;
            border-radius: 999px;
            background: var(--vidrio);
            border: 1px solid var(--menta);
            font-size: .9rem;
            font-weight: 600;
        }
        .punto { width: 10px; height: 10px; border-radius: 50%; background: #9aa; }
        .estado.ok .punto { background: var(--hoja); }
        .estado.error .punto { background: var(--temp); }

        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .card {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            column-gap: 1rem;
            padding: 1.1rem 1.2rem;
            background: var(--vidrio);
            border: 2px solid var(--menta);
            border-radius: 22px 22px 22px 6px;
        }
        .card svg { width: 44px; height: 44px; grid-row: span 3; }
        .card .nombre { font-weight: 600; }
        .card b { font-size: 2.3rem; font-weight: 800; line-height: 1.1; }
        .card small { font-weight: 600; color: #4d6e55; }
        #cT svg { color: var(--temp); }
        #cH svg { color: var(--hum); }
        .card.alerta { background: #fde4de; border-color: var(--temp); }
        .card.alerta small { color: #a3301f; }

        .aviso {
            margin: 1rem 0 0;
            padding: .7rem 1rem;
            border-radius: 12px;
            background: #fde4de;
            border: 2px solid var(--temp);
            font-weight: 600;
        }
        .vacio {
            margin: 1rem 0 0;
            padding: .9rem 1rem;
            border-radius: 12px;
            background: var(--vidrio);
            border: 2px dashed var(--hoja);
        }

        .grafica {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--vidrio);
            border: 2px solid var(--menta);
            border-radius: 18px;
        }
        .grafica h2 { margin: 0 0 .6rem; font-size: 1.05rem; color: var(--hoja-osc); }
        .lienzo { position: relative; height: 300px; }

        /* Jardín al pie */
        .jardin { position: relative; z-index: 1; margin-top: -4px; }
        .jardin svg.plantas { display: block; width: 100%; height: auto; }
        .suelo { height: 34px; background: var(--tierra); border-radius: 0 0 10px 10px; margin: 0 -1rem; }

        [hidden] { display: none !important; }

        @media (max-width: 560px) {
            .cards { grid-template-columns: 1fr; }
            .invernadero { padding: 3.5rem 1rem 1rem; border-radius: 50% 50% 18px 18px / 80px 80px 18px 18px; }
            .deco { display: none; }
        }
    </style>
</head>

<body>
    <!-- Elementos reutilizables: hoja y plantas -->

        <defs>

            </symbol>
            <symbol id="planta" viewBox="0 0 100 150">
                <path d="M50 108C50 80 48 60 50 28" stroke="#2f7a40" stroke-width="4" fill="none" stroke-linecap="round" />
                <g fill="#4fa95d">
                    <use href="#hoja" width="40" height="20" transform="translate(50 100) rotate(-35) translate(0 -10)" />
                    <use href="#hoja" width="40" height="20" transform="translate(50 100) rotate(-145) translate(0 -10)" />
                    <use href="#hoja" width="36" height="18" transform="translate(50 74) rotate(-55) translate(0 -9)" />
                    <use href="#hoja" width="36" height="18" transform="translate(50 74) rotate(-125) translate(0 -9)" />
                    <use href="#hoja" width="30" height="15" transform="translate(50 50) rotate(-45) translate(0 -7)" />
                    <use href="#hoja" width="30" height="15" transform="translate(50 50) rotate(-135) translate(0 -7)" />
                    <use href="#hoja" width="34" height="17" transform="translate(50 32) rotate(-90) translate(0 -8)" />
                </g>
                <path d="M28 114h44l-6 34H34z" fill="#b8704a" />
                <rect x="24" y="108" width="52" height="9" rx="3" fill="#a35f3d" />
            </symbol>
            <symbol id="brote" viewBox="0 0 100 150">
                <g fill="#7cc27f">
                    <use href="#hoja" width="44" height="22" transform="translate(50 112) rotate(-20) translate(0 -11)" />
                    <use href="#hoja" width="44" height="22" transform="translate(50 112) rotate(-160) translate(0 -11)" />
                    <use href="#hoja" width="44" height="22" transform="translate(50 112) rotate(-55) translate(0 -11)" />
                    <use href="#hoja" width="44" height="22" transform="translate(50 112) rotate(-125) translate(0 -11)" />
                    <use href="#hoja" width="44" height="22" transform="translate(50 112) rotate(-90) translate(0 -11)" />
                </g>
                <path d="M32 116h36l-5 32H37z" fill="#c9825a" />
                <rect x="28" y="110" width="44" height="9" rx="3" fill="#b8704a" />
            </symbol>
        </defs>
    </svg>

    <div class="pagina">
        <svg class="deco izq" viewBox="0 0 220 260" aria-hidden="true">
            <g fill="#8fd08f" opacity=".75">
                <use href="#hoja" width="120" height="60" transform="translate(40 30) rotate(35)" />
                <use href="#hoja" width="100" height="50" transform="translate(30 90) rotate(60)" />
            </g>
            <g fill="#4fa95d" opacity=".6">
                <use href="#hoja" width="110" height="55" transform="translate(20 150) rotate(20)" />
            </g>
        </svg>
        <svg class="deco der" viewBox="0 0 220 260" aria-hidden="true">
            <g fill="#8fd08f" opacity=".75">
                <use href="#hoja" width="120" height="60" transform="translate(40 30) rotate(35)" />
                <use href="#hoja" width="100" height="50" transform="translate(30 90) rotate(60)" />
            </g>
            <g fill="#4fa95d" opacity=".6">
                <use href="#hoja" width="110" height="55" transform="translate(20 150) rotate(20)" />
            </g>
        </svg>

        <main class="invernadero">
            <header>
                <h1>Mi invernadero</h1>
                <p class="sub">Temperatura y humedad en tiempo real</p>
                <div class="estado" id="estado"><span class="punto"></span><span id="estadoTxt">Conectando…</span></div>
            </header>

            <div class="cards">
                <div class="card" id="cT">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z" />
                    </svg>
                    <span class="nombre">Temperatura</span>
                    <b id="valT">--</b>
                    <small id="estT">Sin datos</small>
                </div>
                <div class="card" id="cH">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z" />
                    </svg>
                    <span class="nombre">Humedad</span>
                    <b id="valH">--</b>
                    <small id="estH">Sin datos</small>
                </div>
            </div>

            <p class="aviso" id="aviso" hidden>Alerta: los valores salieron del rango. Revisa ventilación y riego.</p>
            <p class="vacio" id="vacio" hidden>Aún no hay lecturas guardadas. Comprueba que el ESP32 esté publicando en el topic correcto.</p>

            <section class="grafica">
                <h2>Últimas 30 lecturas</h2>
                <div class="lienzo"><canvas id="grafica"></canvas></div>
            </section>
        </main>

        <div class="jardin" aria-hidden="true">
            <svg class="plantas" viewBox="0 0 880 150" preserveAspectRatio="xMidYMax meet">
                <use href="#brote" x="20" y="40" width="70" height="105" />
                <use href="#planta" x="130" y="5" width="100" height="150" />
                <use href="#brote" x="290" y="45" width="64" height="96" />
                <use href="#planta" x="420" y="25" width="80" height="120" />
                <use href="#brote" x="560" y="30" width="80" height="120" />
                <use href="#planta" x="690" y="0" width="105" height="157" />
                <use href="#brote" x="800" y="50" width="60" height="90" />
            </svg>
            <div class="suelo"></div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        const API = location.hostname === 'localhost' ? '' : 'https://invernadero-backend.onrender.com';
        const WS_URL = API ? API.replace(/^http/, 'ws') + '/ws' : `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;

        const chart = new Chart($('grafica'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temp (°C)', data: [], yAxisID: 'y',
                        borderColor: '#d9533f', backgroundColor: 'rgba(217,83,63,.12)',
                        fill: true, tension: .35, pointRadius: 2,
                    },
                    {
                        label: 'Humedad (%)', data: [], yAxisID: 'y1',
                        borderColor: '#2f86b5', backgroundColor: 'rgba(47,134,181,.12)',
                        fill: true, tension: .35, pointRadius: 2,
                    },
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { font: { family: 'Nunito', weight: '600' } } } },
                scales: {
                    x: { grid: { color: 'rgba(61,145,80,.15)' } },
                    y: { position: 'left', title: { display: true, text: '°C' }, grid: { color: 'rgba(61,145,80,.15)' } },
                    y1: { position: 'right', title: { display: true, text: 'Humedad' }, grid: { drawOnChartArea: false } },
                },
            },
        });

        function setEstado(tipo, texto) {
            $('estado').className = 'estado ' + tipo;
            $('estadoTxt').textContent = texto;
        }

        function pintarUltima(u) {
            $('valT').textContent = u.temperatura.toFixed(1) + ' °C';
            $('valH').textContent = u.humedad.toFixed(1) /*+ ' %'*/;
            $('cT').classList.toggle('alerta', u.alerta);
            $('cH').classList.toggle('alerta', u.alerta);
            $('estT').textContent = u.alerta ? 'Fuera de rango' : 'En rango';
            $('estH').textContent = u.alerta ? 'Fuera de rango' : 'En rango';
            $('aviso').hidden = !u.alerta;
            $('vacio').hidden = true;
        }

        async function cargarHistorial() {
            try {
                const r = await fetch('/api/lecturas?limit=30');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const d = await r.json();
                if (!d.length) { $('vacio').hidden = false; return; }
                chart.data.labels = d.map(x => new Date(x.createdAt).toLocaleTimeString());
                chart.data.datasets[0].data = d.map(x => x.temperatura);
                chart.data.datasets[1].data = d.map(x => x.humedad);
                chart.update();
                pintarUltima(d[d.length - 1]);
            } catch (e) {
                console.error(e);
                setEstado('error', 'Sin conexión con el servidor');
            }
        }

        // Tiempo real con WebSocket (reconecta solo)
        function conectarWS() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            // const ws = new WebSocket(`${proto}://${location.host}/ws`);
            const ws = new WebSocket(WS_URL);

            ws.onopen = () => setEstado('ok', 'En vivo');
            ws.onmessage = (e) => {
                const u = JSON.parse(e.data);
                chart.data.labels.push(new Date(u.createdAt).toLocaleTimeString());
                chart.data.datasets[0].data.push(u.temperatura);
                chart.data.datasets[1].data.push(u.humedad);
                if (chart.data.labels.length > 30) {
                    chart.data.labels.shift();
                    chart.data.datasets.forEach(ds => ds.data.shift());
                }
                chart.update();
                pintarUltima(u);
                setEstado('ok', 'En vivo: ' + new Date(u.createdAt).toLocaleTimeString());
            };
            ws.onclose = () => {
                setEstado('error', 'Reconectando…');
                setTimeout(conectarWS, 3000);
            };
        }

        cargarHistorial();
        conectarWS();

    </script>
</body>

</html>
